[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cement_calc"
version = "0.1.0"
description = "Cementing volumetrics cross-check: primary casing job and balanced plug, in oilfield units."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Will Whitmire" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cement-calc = "cement_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
